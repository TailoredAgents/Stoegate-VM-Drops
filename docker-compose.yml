services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stonegate_vm_drops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - stonegate_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stonegate_vm_drops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stonegate_postgres:
