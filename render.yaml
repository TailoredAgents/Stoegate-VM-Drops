databases:
  # Resource identifiers stay unchanged so the existing Render deployment and
  # database are not replaced during the SMS product rebrand.
  - name: stonegate-vm-drops-db
    region: virginia
    databaseName: stonegate_vm_drops
    user: stonegate_vm_drops
    # The application uses Render's private network; do not expose Postgres to
    # external source ranges by default.
    ipAllowList: []

services:
  - type: web
    name: stonegate-vm-drops
    runtime: node
    region: virginia
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    preDeployCommand: npm run db:deploy
    initialDeployHook: npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: stonegate-vm-drops-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SMS_LIVE_SENDS_ENABLED
        value: "false"
      - key: SMS_PROVIDER
        value: dry-run
      - key: DEFAULT_DAILY_SMS_LIMIT
        value: "2000"
      - key: MAX_LIVE_SMS_CAMPAIGN_LIMIT
        value: "10"
      - key: MAX_LIVE_DAILY_SMS_LIMIT
        value: "10"
      - key: DEFAULT_SMS_TO_COLD_CALL_DELAY_HOURS
        value: "48"

  - type: worker
    name: stonegate-vm-drops-worker
    runtime: node
    region: virginia
    buildCommand: npm ci --include=dev && npm run db:generate
    # Each service gates its own rollout on the same idempotent migration chain,
    # so an independently deployed worker cannot start against the old schema.
    preDeployCommand: npm run db:deploy
    startCommand: npm run worker
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: stonegate-vm-drops-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SMS_LIVE_SENDS_ENABLED
        value: "false"
      - key: SMS_PROVIDER
        value: dry-run
      - key: DEFAULT_DAILY_SMS_LIMIT
        value: "2000"
      - key: MAX_LIVE_SMS_CAMPAIGN_LIMIT
        value: "10"
      - key: MAX_LIVE_DAILY_SMS_LIMIT
        value: "10"
      - key: DEFAULT_SMS_TO_COLD_CALL_DELAY_HOURS
        value: "48"
      - key: WORKER_CONCURRENCY
        value: "4"
